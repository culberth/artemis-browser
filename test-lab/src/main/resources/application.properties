spring.application.name=artemis-regression-lab

# Loopback only: LoopbackOnlyGuard refuses to start with anything else. 8082, beside Artemis Browser's 8080.
server.address=127.0.0.1
server.port=8082
# Its own session cookie. Cookies ignore ports, so with the default JSESSIONID, signing Artemis Browser (8080) in on
# localhost replaced the lab's session, and every lab form then failed its CSRF check with a bare 403.
server.servlet.session.cookie.name=ARTEMISLAB_SESSION

# Run manifests live here, one JSON file per run. Never contains a password.
lab.data-dir=${user.home}/.artemis-lab

# The disposable broker. Published on 127.0.0.1 only; a taken port is refused, never moved.
lab.broker.port=62616
lab.broker.user=artemis
lab.broker.password=artemis

# Server-side bounds; each has a hard ceiling in LabLimits.
lab.limits.max-messages=1000
lab.limits.max-body-bytes=262144
lab.limits.max-workers=2
lab.limits.max-run-bytes=52428800
lab.limits.operation-timeout=10s
lab.limits.readiness-deadline=30s
lab.limits.max-runs=50
lab.limits.max-live-workers=20
lab.limits.max-rate=200
lab.limits.max-traffic=5m

spring.thymeleaf.cache=false
