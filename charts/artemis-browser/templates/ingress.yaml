{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # The backend speaks TLS. Without this the controller sends plain HTTP to port 8443 and every
    # request fails in a way that looks like the app is broken.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- /* HTTPS only once the secret exists, so an install before it is made stays plain HTTP
         rather than redirecting to the controller's fake certificate. */}}
  {{- $tlsSecret := .Values.ingress.tls.secretName }}
  {{- if and $tlsSecret (lookup "v1" "Secret" .Release.Namespace $tlsSecret) }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: https
{{- end }}
