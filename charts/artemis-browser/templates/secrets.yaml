{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ required "auth.username is required" .Values.auth.username | quote }}
  {{- /*
    Required rather than defaulted: an app with no login configured lets nobody in at all, which
    would look like a broken deployment rather than a missing setting.
  */}}
  password-hash: {{ required "auth.passwordHash is required - generate one with --hash-password=" .Values.auth.passwordHash | quote }}
{{- end }}
---
{{- if not .Values.tls.existingSecret }}
{{- /*
  The pod must serve TLS or ReachabilityGuard refuses to start, and there is no cert-manager here.
  So the chart mints a self-signed certificate — but only once: `lookup` finds the Secret from a
  previous install and reuses it, because regenerating on every `helm upgrade` would hand the
  browser a different certificate each time and invalidate every open session.

  lookup returns nothing on `helm template` and on a dry run, so a fresh certificate is generated
  there too; that output is not what gets installed.
*/}}
{{- $name := printf "%s-tls" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $cert := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- $cert = index $existing.data "tls.crt" | b64dec }}
{{- $key = index $existing.data "tls.key" | b64dec }}
{{- else }}
{{- $host := .Values.ingress.host | default (printf "%s.%s.svc.cluster.local" .Release.Name .Release.Namespace) }}
{{- $alt := list $host .Release.Name (printf "%s.%s" .Release.Name .Release.Namespace) (printf "%s.%s.svc" .Release.Name .Release.Namespace) (printf "%s.%s.svc.cluster.local" .Release.Name .Release.Namespace) "localhost" }}
{{- $generated := genSelfSignedCert $host (list "127.0.0.1") $alt (int .Values.tls.validityDays) }}
{{- $cert = $generated.Cert }}
{{- $key = $generated.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ .Release.Name }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc }}
  tls.key: {{ $key | b64enc }}
{{- end }}
