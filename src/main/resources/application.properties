spring.application.name=artemis-browser

# Loopback only. This app holds a live, authenticated broker connection and has no login of its
# own, so it must not be reachable from the network. LoopbackHostFilter enforces the matching
# Host-header check; changing either without the other leaves a hole.
server.address=127.0.0.1
server.port=8080

# The broker connection lives in the HTTP session, so session expiry is also connection expiry.
server.servlet.session.timeout=30m

# How long to wait for the broker to answer a management query, and to establish a connection.
artemis.management-timeout-ms=10000
artemis.connection-timeout-ms=10000

# Characters of body shown per row in the message list, and in the single-message view.
artemis.body-preview-chars=200
artemis.body-detail-chars=200000

# Where remembered brokers are kept. Host, port and username only - never passwords.
# Defaults to ${user.home}/.artemis-browser/connections.json when left blank.
artemis.connections-file=

# Cross-queue search: messages fetched per matching queue (the count is always exact).
artemis.search-max-per-queue=50

# Upper bound on an export, so a download cannot try to pull an entire large queue.
artemis.export-max-messages=5000

# Export reads real bodies through one JMS browser pass, because management browse truncates a body
# at the broker's management-message-attribute-size-limit (256 chars by default) and has nothing at
# all for bytes/map/stream messages. This caps how far that pass will walk before giving up;
# messages it does not reach keep their (truncated, and flagged) management body.
artemis.export-body-scan-limit=20000
