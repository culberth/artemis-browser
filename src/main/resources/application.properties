spring.application.name=artemis-browser

# Loopback by default. This app holds a live, authenticated broker connection, so reaching the port
# must not be the same as reading the broker. AllowedHostFilter enforces the matching Host-header
# check, which stops a remote page driving this UI through a victim's browser (DNS rebinding).
#
# To run it somewhere other than this machine - a jump host, say - change this address AND set both
# a login (artemis.auth.* below) and TLS (server.ssl.*). ReachabilityGuard refuses to start
# otherwise, because authentication over cleartext HTTP would put this tool's password and the
# broker's on the wire while looking protected.
server.address=127.0.0.1
server.port=8080

# The tool's own login. Blank, on loopback, means no sign-in at all: only this machine can reach the
# port. Anywhere else ReachabilityGuard refuses to start without one. Generate the hash with:
#     mvn spring-boot:run -Dspring-boot.run.arguments=--hash-password=yourpassword
# The hash is a bcrypt one, with or without a {bcrypt} prefix. Never put the plain password here.
artemis.auth.username=
artemis.auth.password-hash=

# Host headers this app answers to, beyond loopback which is always allowed. Set this to the
# hostname people will actually type when it is not on their own machine. Comma-separated.
artemis.allowed-hosts=

# The broker connection lives in the HTTP session, so session expiry is also connection expiry.
server.servlet.session.timeout=30m

# How long to wait for the broker to answer a management query, and to establish a connection.
artemis.management-timeout-ms=10000
artemis.connection-timeout-ms=10000

# Characters of body shown per row in the message list, and in the single-message view.
artemis.body-preview-chars=200
artemis.body-detail-chars=200000

# Where remembered brokers are kept. Host, port and username only - never passwords.
# Defaults to ${user.home}/.artemis-browser/connections.json when left blank.
artemis.connections-file=

# Cross-queue search: messages fetched per matching queue (the count is always exact).
artemis.search-max-per-queue=50

# Upper bound on an export, so a download cannot try to pull an entire large queue.
artemis.export-max-messages=5000

# Export reads real bodies through one JMS browser pass, because management browse truncates a body
# at the broker's management-message-attribute-size-limit (256 chars by default) and has nothing at
# all for bytes/map/stream messages. This caps how far that pass will walk before giving up;
# messages it does not reach keep their (truncated, and flagged) management body.
artemis.export-body-scan-limit=20000

# ...and this caps what that pass keeps, since it is the one place here holding real bodies in
# memory: 20M characters is roughly 40MB of body text, after which remaining rows keep their
# management body. Without it the ceiling would be export-max-messages x body-detail-chars.
artemis.export-body-total-chars=20000000

# The most in-flight messages (delivered to a consumer, not yet acknowledged) a queue page will list.
# The broker's listDeliveringMessagesAsJSON has no paging, so above this the call is not made at all.
# Measured on 2.44.0: ~280 characters per small message; 1,000 in flight = 278KB in ~15ms, and
# 100,000 = 28MB in ~800ms. One consumer on the default 1MB window holds about 3,200 small messages,
# so 5,000 lists that case whole at about 1.4MB.
artemis.in-flight-limit=5000

# Trends: this session keeps readings of every queue's counters, taken only when a page lists the
# queues anyway (nothing polls in the background). At most one reading per spacing, at most
# max-readings of them (the oldest dropped first) and at most max-queues queues followed, so a
# session holds at most max-readings x max-queues small points: 240 x 500 = 120,000, a few MB.
# The defaults reach back about an hour while a page is open.
artemis.trends.spacing-seconds=15
artemis.trends.max-readings=240
artemis.trends.max-queues=500
