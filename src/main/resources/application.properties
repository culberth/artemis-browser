spring.application.name=artemis-browser

# Loopback by default. This app holds a live, authenticated broker connection, so reaching the port
# must not be the same as reading the broker. AllowedHostFilter enforces the matching Host-header
# check, which stops a remote page driving this UI through a victim's browser (DNS rebinding).
#
# To run it somewhere other than this machine - a jump host, say - change this address AND set both
# a login (artemis.auth.* below) and TLS (server.ssl.*). ReachabilityGuard refuses to start
# otherwise, because authentication over cleartext HTTP would put this tool's password and the
# broker's on the wire while looking protected.
server.address=127.0.0.1
server.port=8080

# The tool's own login. Blank, on loopback, means no sign-in at all: only this machine can reach the
# port. Anywhere else ReachabilityGuard refuses to start without one. Generate the hash with:
#     mvn spring-boot:run -Dspring-boot.run.arguments=--hash-password=yourpassword
# The hash is a bcrypt one, with or without a {bcrypt} prefix. Never put the plain password here.
artemis.auth.username=
artemis.auth.password-hash=

# Host headers this app answers to, beyond loopback which is always allowed. Set this to the
# hostname people will actually type when it is not on their own machine. Comma-separated.
artemis.allowed-hosts=

# The broker connection lives in the HTTP session, so session expiry is also connection expiry.
server.servlet.session.timeout=30m

# How long to wait for the broker to answer a management query, and to establish a connection.
artemis.management-timeout-ms=10000
artemis.connection-timeout-ms=10000

# Characters of body shown per row in the message list, and in the single-message view.
artemis.body-preview-chars=200
artemis.body-detail-chars=200000

# Where remembered brokers are kept. Host, port and username only - never passwords.
# Defaults to ${user.home}/.artemis-browser/connections.json when left blank.
artemis.connections-file=

# Saved searches (/saved): a name, a filter and where it runs - never results, bodies or passwords.
# Kept in one JSON file, by default ${user.home}/.artemis-browser/saved-searches.json beside the
# remembered connections. At most max-entries of them, each name and filter capped; a file that cannot
# be read is reported and never overwritten. Nothing runs a saved search except its Run button.
artemis.saved-searches.file=
artemis.saved-searches.max-entries=200
artemis.saved-searches.max-name-chars=100
artemis.saved-searches.max-filter-chars=4000

# Cross-queue search: messages fetched per matching queue (the count is always exact).
artemis.search-max-per-queue=50

# Upper bound on an export, so a download cannot try to pull an entire large queue.
artemis.export-max-messages=5000

# Export reads real bodies through one JMS browser pass, because management browse truncates a body
# at the broker's management-message-attribute-size-limit (256 chars by default) and has nothing at
# all for bytes/map/stream messages. This caps how far that pass will walk before giving up;
# messages it does not reach keep their (truncated, and flagged) management body.
artemis.export-body-scan-limit=20000

# ...and this caps what that pass keeps, since it is the one place here holding real bodies in
# memory: 20M characters is roughly 40MB of body text, after which remaining rows keep their
# management body. Without it the ceiling would be export-max-messages x body-detail-chars.
artemis.export-body-total-chars=20000000

# The most in-flight messages (delivered to a consumer, not yet acknowledged) a queue page will list.
# The broker's listDeliveringMessagesAsJSON has no paging, so above this the call is not made at all.
# Measured on 2.44.0: ~280 characters per small message; 1,000 in flight = 278KB in ~15ms, and
# 100,000 = 28MB in ~800ms. One consumer on the default 1MB window holds about 3,200 small messages,
# so 5,000 lists that case whole at about 1.4MB.
artemis.in-flight-limit=5000

# Trends: this session keeps readings of every queue's counters, taken only when a page lists the
# queues anyway (nothing polls in the background). At most one reading per spacing, at most
# max-readings of them (the oldest dropped first) and at most max-queues queues followed, so a
# session holds at most max-readings x max-queues small points: 240 x 500 = 120,000 — measured at
# about 10MB of heap per session at that cap (ScaleMeasurementIT, 2026-09-30).
# The defaults reach back about an hour while a page is open.
artemis.trends.spacing-seconds=15
artemis.trends.max-readings=240
artemis.trends.max-queues=500

# Message-ID lookup (/search with an ID:...): one message looked for in every state - scheduled,
# waiting, in flight, prepared. The scheduled and in-flight lists cannot be paged, so each queue's
# count is checked against these before its list is asked for, and a queue over them is reported as
# skipped, with the limit, rather than as "not found". The per-queue in-flight limit is
# artemis.in-flight-limit above; prepared transactions use artemis.transactions.detail-limit below.
artemis.investigate.max-queues=2000
artemis.investigate.max-hits=100
artemis.investigate.max-in-flight=20000
artemis.investigate.max-scheduled-per-queue=5000
artemis.investigate.max-scheduled=20000

# Incident snapshot (/snapshot): each client listing keeps at most max-rows rows and records how many
# there were; address settings are read for at most max-address-settings addresses, the ones with
# something to explain (near a limit, paging, dropping, killing or expiring) first.
artemis.snapshot.max-rows=1000
artemis.snapshot.max-address-settings=200

# Prepared XA transactions (/transactions, diagnose, snapshot): the broker's detail reply carries every
# prepared branch's messages at once with no paging, so past this many branches only their summary
# lines (Xid and creation time) are read. Each branch shows at most 50 of its messages either way.
artemis.transactions.detail-limit=100

# Roles are read for at most this many addresses in an incident snapshot, one call each, in the same
# order as address settings. A refused roles call stands for every address and is not repeated.
artemis.snapshot.max-address-permissions=200

# Dead-letter and expiry triage (/triage): a sample from the head of one queue, read with management
# browse in pages of up to 200 and grouped by origin here. default-sample when none is asked for,
# max-sample at most; at most max-groups origins (and property values) are listed, largest first; the
# settings of at most max-settings-reads origin addresses are read, one call each.
artemis.triage.default-sample=500
artemis.triage.max-sample=2000
artemis.triage.max-groups=50
artemis.triage.max-settings-reads=20

# Message comparison (/message/compare): two messages read through the JMS browser, one after the
# other, on request. At most max-body-chars of each text body are compared (the read itself stops at
# body-detail-chars); a changed region of more than max-align-cells (left lines x right lines) is
# shown as replaced rather than aligned; at most max-shown-lines diff lines or JSON differences are
# drawn; a JSON body with more than max-json-values values is compared as text.
artemis.message-compare.max-body-chars=100000
artemis.message-compare.max-align-cells=1000000
artemis.message-compare.max-shown-lines=2000
artemis.message-compare.max-json-values=5000

# Snapshot comparison (/compare): two saved JSON snapshots, read in the request and never stored. Each
# file is at most max-file-bytes and at most max-rows entries in any one section, or it is refused
# with the reason. The trends section is skipped while reading, since a comparison does not use it -
# at the trend cap it is the largest part of a snapshot. The multipart limit follows it; past it
# Tomcat answers 413 before any controller runs, and templates/error/413.html explains.
artemis.compare.max-file-bytes=67108864
artemis.compare.max-rows=50000
spring.servlet.multipart.max-file-size=${artemis.compare.max-file-bytes}
spring.servlet.multipart.max-request-size=140MB
# Read (and discard) the rest of an oversized upload up to this much, so the browser gets the 413
# page instead of a reset connection.
server.tomcat.max-swallow-size=140MB
