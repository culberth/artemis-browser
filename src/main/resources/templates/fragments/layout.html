<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  One nav for every page. Each page passes the name of the section it is in so the current tab can
  be marked; adding a page means adding it here once, not in six templates that drift apart.
-->
<div th:fragment="nav(active)" class="panel topbar">
    <div>
        <h1 style="margin:0">artemis-browser</h1>
        <span class="conn" th:if="${connection}" th:text="${connection.describe()}">user@host:port</span>
    </div>
    <div class="field-row nav">
        <a class="tab" th:classappend="${active == 'broker'} ? 'current' : ''"
           th:href="@{/broker}">Broker</a>
        <a class="tab" th:classappend="${active == 'overview'} ? 'current' : ''"
           th:href="@{/overview}">Queues</a>
        <a class="tab" th:classappend="${active == 'addresses'} ? 'current' : ''"
           th:href="@{/addresses}">Addresses</a>
        <a class="tab" th:classappend="${active == 'browse'} ? 'current' : ''"
           th:href="@{/queues}">Browse</a>
        <a class="tab" th:classappend="${active == 'search'} ? 'current' : ''"
           th:href="@{/search}">Search</a>
        <a class="tab" th:classappend="${active == 'diagnose'} ? 'current' : ''"
           th:href="@{/diagnose}">Diagnose</a>
        <form method="post" th:action="@{/disconnect}">
            <button class="secondary" type="submit">Disconnect</button>
        </form>
        <!-- Only when someone is signed in: on loopback with no login configured there is no one to sign out. -->
        <form method="post" th:action="@{/logout}" th:if="${currentUser != null}">
            <button class="secondary" type="submit" th:title="'Signed in as ' + ${currentUser}">Sign out</button>
        </form>
    </div>
</div>

<div th:fragment="refresh(action, active, keep)" class="panel field-row">
    <form method="get" th:action="${action}" class="field-row" style="width:100%">
        <!--
          Whatever else describes the current view. Auto-refresh re-requests the URL and keeps it
          for free; this form would otherwise drop it when the interval changes.
        -->
        <input type="hidden" th:each="k : ${keep}" th:name="${k.key}" th:value="${k.value}">
        <div>
            <label for="refresh">Auto-refresh</label>
            <select id="refresh" name="refresh" onchange="this.form.submit()">
                <option th:each="r : ${refreshChoices}"
                        th:value="${r}"
                        th:text="${r == 0} ? 'Off' : ('Every ' + ${r} + 's')"
                        th:selected="${r == refresh}">Off</option>
            </select>
        </div>
        <div>
            <button type="submit">Refresh now</button>
        </div>
    </form>
</div>

<!--
  A value the broker did not give, in place of the value. Never a zero: a disk at "0%" is a healthy
  disk, and a missing reading must not look like one. The broker's own words go in the title.
-->
<span th:fragment="missing(reading)" class="unavailable"
      th:title="${reading.detail()}" th:text="'— ' + ${reading.reason()}">— not available</span>

<!-- A whole panel the broker did not give, with its reason, so the panels around it still stand. -->
<p th:fragment="panelMissing(reading)" class="unavailable">
    <span th:text="'Not shown: ' + ${reading.reason()} + '.'">Not shown: not permitted for this user.</span>
    <span class="muted" th:if="${!reading.detail().isBlank()}" th:text="${reading.detail()}">AMQ229032 …</span>
</p>

<!-- When a panel's figures were read. Panels are read one after another, not at one instant. -->
<span th:fragment="collected(reading)" class="muted collected"
      th:text="'read ' + ${reading.collectedText()}">read 12:00:00</span>

</body>
</html>
