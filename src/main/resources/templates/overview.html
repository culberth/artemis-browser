<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>artemis-browser &mdash; overview</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <meta th:if="${refresh > 0}" http-equiv="refresh" th:content="${refresh}">
</head>
<body>
<div class="wrap">
    <div th:replace="~{fragments/layout :: nav('overview')}"></div>

    <div class="error" th:if="${error}" th:text="${error}">error</div>

    <div th:replace="~{fragments/layout :: refresh('/overview', 'overview', ${viewParams})}"></div>

    <div class="panel">
        <h2>
            Queues
            <span class="muted"
                  th:text="${q.isEmpty()} ? '(' + ${queues.size()} + ')'
                           : '(' + ${queues.size()} + ' of ' + ${totalQueues} + ')'">(0)</span>
        </h2>

        <form method="get" th:action="@{/overview}" class="field-row" style="margin-bottom:.85rem">
            <input type="hidden" name="refresh" th:value="${refresh}">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="dir" th:value="${dir}">
            <div style="flex:1;min-width:18rem">
                <label for="q">Find a queue</label>
                <input id="q" type="text" name="q" th:value="${q}" style="width:100%" autocomplete="off"
                       placeholder="part of a queue or address name">
            </div>
            <div>
                <button type="submit">Filter</button>
            </div>
            <div th:if="${!q.isEmpty()}">
                <a class="badge-link" th:href="@{/overview(refresh=${refresh},sort=${sort},dir=${dir})}">Clear</a>
            </div>
        </form>

        <p class="muted" th:if="${queues.isEmpty() and q.isEmpty()}">This broker reported no queues.</p>
        <p class="muted" th:if="${queues.isEmpty() and !q.isEmpty()}">
            No queue or address matches <code th:text="${q}">x</code>.
        </p>
        <div class="table-scroll" th:unless="${queues.isEmpty()}">
            <table>
                <!--
                  Each heading links to the same page sorted by that column, flipping direction when
                  it is already the sorted one. The arrow says which way, so a sorted table cannot
                  be mistaken for the broker's own ordering.
                -->
                <thead>
                <tr th:with="arrow=${dir == 'desc'} ? ' ▾' : ' ▴',
                             flip=${dir == 'desc'} ? 'asc' : 'desc'">
                    <th th:each="col : ${ {{'name','Queue'},{'address','Address'},{'messages','Messages'},
                                          {'delivering','Delivering'},{'scheduled','Scheduled'},
                                          {'consumers','Consumers'},{'added','Added'},{'acked','Acked'}} }"
                        th:classappend="${col[0] == 'name' or col[0] == 'address'} ? '' : 'num'">
                        <a th:href="@{/overview(refresh=${refresh},q=${q},sort=${col[0]},
                                     dir=${col[0] == sort} ? ${flip} : 'asc')}"
                           th:text="${col[1]} + (${col[0] == sort} ? ${arrow} : '')">Column</a>
                    </th>
                    <th>Flags</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="queue : ${queues}" th:classappend="${queue.stalled()} ? 'row-warn' : ''">
                    <td>
                        <a th:href="@{/queues(name=${queue.name()})}" th:text="${queue.name()}">queue</a>
                    </td>
                    <td class="muted" th:text="${queue.address()}">address</td>
                    <td class="num strong" th:text="${queue.messageCount()}">0</td>
                    <td class="num" th:text="${queue.deliveringCount()}">0</td>
                    <td class="num" th:text="${queue.scheduledCount()}">0</td>
                    <td class="num" th:text="${queue.consumerCount()}">0</td>
                    <td class="num muted" th:text="${queue.messagesAdded()}">0</td>
                    <td class="num muted" th:text="${queue.messagesAcked()}">0</td>
                    <td>
                        <span class="badge" th:if="${queue.paused()}">paused</span>
                        <span class="badge" th:if="${queue.internalQueue()}">internal</span>
                        <span class="badge warn" th:if="${queue.stalled()}">no consumer</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="note">
            Rows flagged <span class="badge warn">no consumer</span> have messages waiting with
            nothing attached to take them.
        </p>
    </div>
</div>
</body>
</html>
