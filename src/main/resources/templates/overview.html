<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>artemis-browser &mdash; overview</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <meta th:if="${refresh > 0}" http-equiv="refresh" th:content="${refresh}">
</head>
<body>
<div class="wrap">
    <div th:replace="~{fragments/layout :: nav('overview')}"></div>

    <div class="error" th:if="${error}" th:text="${error}">error</div>

    <div th:replace="~{fragments/layout :: refresh('/overview', 'overview')}"></div>

    <div class="panel">
        <h2>
            Queues <span class="muted" th:text="'(' + ${queues.size()} + ')'">(0)</span>
        </h2>
        <p class="muted" th:if="${queues.isEmpty()}">This broker reported no queues.</p>
        <div class="table-scroll" th:unless="${queues.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Queue</th>
                    <th>Address</th>
                    <th class="num">Messages</th>
                    <th class="num">Delivering</th>
                    <th class="num">Scheduled</th>
                    <th class="num">Consumers</th>
                    <th class="num">Added</th>
                    <th class="num">Acked</th>
                    <th>Flags</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="q : ${queues}" th:classappend="${q.stalled()} ? 'row-warn' : ''">
                    <td>
                        <a th:href="@{/queues(name=${q.name()})}" th:text="${q.name()}">queue</a>
                    </td>
                    <td class="muted" th:text="${q.address()}">address</td>
                    <td class="num strong" th:text="${q.messageCount()}">0</td>
                    <td class="num" th:text="${q.deliveringCount()}">0</td>
                    <td class="num" th:text="${q.scheduledCount()}">0</td>
                    <td class="num" th:text="${q.consumerCount()}">0</td>
                    <td class="num muted" th:text="${q.messagesAdded()}">0</td>
                    <td class="num muted" th:text="${q.messagesAcked()}">0</td>
                    <td>
                        <span class="badge" th:if="${q.paused()}">paused</span>
                        <span class="badge" th:if="${q.internalQueue()}">internal</span>
                        <span class="badge warn" th:if="${q.stalled()}">no consumer</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="note">
            Rows flagged <span class="badge warn">no consumer</span> have messages waiting with
            nothing attached to take them.
        </p>
    </div>
</div>
</body>
</html>
